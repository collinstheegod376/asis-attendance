# ==============================================================================
# ADUN Attendance System - Local Development Parity Nginx Proxy
# Local Hostnames: https://adun.local, https://admin.adun.local
# Uses mkcert generated certificates for local TLS on iOS/Android test devices
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Upstream dev servers
    upstream student_dev {
        server host.docker.internal:5173; # Vite student-pwa dev server
    }

    upstream admin_dev {
        server host.docker.internal:5174; # Vite admin-portal dev server
    }

    upstream supabase_edge_remote {
        server ijfljngylbzwyyikivob.supabase.co:443;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name adun.local admin.adun.local;
        return 301 https://$host$request_uri;
    }

    # Student PWA Local Server
    server {
        listen 443 ssl http2;
        server_name adun.local;

        ssl_certificate /etc/nginx/certs/adun.local.pem;
        ssl_certificate_key /etc/nginx/certs/adun.local-key.pem;

        # First-party Edge Functions proxy
        location /api/ {
            rewrite ^/api/(.*)$ /functions/v1/$1 break;
            proxy_pass https://supabase_edge_remote;
            proxy_ssl_server_name on;
            proxy_ssl_name ijfljngylbzwyyikivob.supabase.co;

            proxy_set_header Host ijfljngylbzwyyikivob.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;

            proxy_cookie_path / /;
            proxy_cookie_domain ijfljngylbzwyyikivob.supabase.co adun.local;
        }

        # Forward all other requests to Vite dev server (with HMR WebSockets)
        location / {
            proxy_pass http://student_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Admin Portal Local Server
    server {
        listen 443 ssl http2;
        server_name admin.adun.local;

        ssl_certificate /etc/nginx/certs/adun.local.pem;
        ssl_certificate_key /etc/nginx/certs/adun.local-key.pem;

        location /api/ {
            rewrite ^/api/(.*)$ /functions/v1/$1 break;
            proxy_pass https://supabase_edge_remote;
            proxy_ssl_server_name on;
            proxy_ssl_name ijfljngylbzwyyikivob.supabase.co;

            proxy_set_header Host ijfljngylbzwyyikivob.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;

            proxy_cookie_path / /;
            proxy_cookie_domain ijfljngylbzwyyikivob.supabase.co admin.adun.local;
        }

        location / {
            proxy_pass http://admin_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
