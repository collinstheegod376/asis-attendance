# ==============================================================================
# ADUN Attendance System - Production Nginx Reverse Proxy Configuration
# Architecture: First-party origin routing for HttpOnly device binding cookies
# ==============================================================================

# Worker and event tuning
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones (Defense in depth)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;

    # Upstream Supabase Edge Functions
    # Replace with your actual project reference
    upstream supabase_edge {
        server ijfljngylbzwyyikivob.supabase.co:443;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Redirect to HTTPS (All domains)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name attendance.adun.edu.ng admin.attendance.adun.edu.ng;

        # ACME challenge for Let's Encrypt / Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. Student Mobile PWA & First-Party Edge Function Proxy
    # Origin: https://attendance.adun.edu.ng
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name attendance.adun.edu.ng;

        # TLS Certificates (Let's Encrypt / Production CA)
        ssl_certificate /etc/letsencrypt/live/attendance.adun.edu.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/attendance.adun.edu.ng/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern TLS Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

        # Root static files for Student PWA
        root /var/www/student-pwa;
        index index.html;

        # Static assets cache control (1 year immutable)
        location /assets/ {
            limit_req zone=static_limit burst=50 nodelay;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Service Worker & Manifest (Never cache stale)
        location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # MediaPipe Vision Tasks & WASM binaries (Cache for 30 days)
        location /mediapipe/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ======================================================================
        # CRITICAL REVERSE PROXY: /api/* -> Supabase Edge Functions v1
        # Fixes PERF-04, PERF-05, G4: Makes adun_trusted_device a first-party cookie
        # ======================================================================
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;

            # Rewrite /api/foo to /functions/v1/foo
            rewrite ^/api/(.*)$ /functions/v1/$1 break;

            proxy_pass https://supabase_edge;
            proxy_ssl_server_name on;
            proxy_ssl_name ijfljngylbzwyyikivob.supabase.co;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Header preservation & forwarding (Do NOT strip Cookie/Auth)
            proxy_set_header Host ijfljngylbzwyyikivob.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_request_headers on;

            # First-Party Cookie translation:
            # Map upstream Set-Cookie path and domain to first-party origin
            proxy_cookie_path / /;
            proxy_cookie_domain ijfljngylbzwyyikivob.supabase.co attendance.adun.edu.ng;

            # Buffer & Timeout settings for file uploads (selfie)
            client_max_body_size 10M;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        # Single Page Application fallback for Student PWA
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # --------------------------------------------------------------------------
    # 3. Admin & Lecturer Web Portal (Isolated Host)
    # Origin: https://admin.attendance.adun.edu.ng
    # Keeps session tokens, auth cookies, and administrative scope clean
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.attendance.adun.edu.ng;

        ssl_certificate /etc/letsencrypt/live/admin.attendance.adun.edu.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.attendance.adun.edu.ng/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /var/www/admin-portal;
        index index.html;

        # Static assets cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # API proxy for admin-initiated functions (import-roster, reset-device-binding)
        location /api/ {
            rewrite ^/api/(.*)$ /functions/v1/$1 break;

            proxy_pass https://supabase_edge;
            proxy_ssl_server_name on;
            proxy_ssl_name ijfljngylbzwyyikivob.supabase.co;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host ijfljngylbzwyyikivob.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;

            proxy_cookie_path / /;
            proxy_cookie_domain ijfljngylbzwyyikivob.supabase.co admin.attendance.adun.edu.ng;

            client_max_body_size 25M; # Support large CSV/Excel rosters
            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
