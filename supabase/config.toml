project_id = "adun-attendance"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.selfies]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[functions.validate-session-token]
verify_jwt = false

[functions.lookup-matric]
verify_jwt = false

[functions.device-check]
verify_jwt = false

[functions.verify-location]
verify_jwt = false

[functions.upload-selfie]
verify_jwt = false

[functions.submit-attendance]
verify_jwt = false

[functions.reset-device-binding]
verify_jwt = false

[functions.import-roster]
verify_jwt = false

